[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varroa-model"
version = "0.1.0"
description = "Clean re-implementation of Randy Oliver's Varroa mite population model (V2026)"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "delight-f" }]
keywords = ["varroa", "mite", "honey-bee", "population-model", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# Only needed by scripts/validate.py to read the reference workbook.
validate = ["openpyxl>=3.1"]
dev = ["ruff>=0.5", "basedpyright>=1.39"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
varroa = ["*.json"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "UP",   # pyupgrade - flags outdated syntax
    "F",    # pyflakes
    "E",    # pycodestyle
    "I",    # isort
]

[tool.ruff.lint.isort]
known-first-party = ["varroa"]

[tool.basedpyright]
enableTypeIgnoreComments = true
typeCheckingMode = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]